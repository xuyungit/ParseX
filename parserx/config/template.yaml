# ParserX global configuration (written by `parserx init`; the same settings as the project's parserx.yaml).
# Credentials come from environment variables, e.g. ~/.config/parserx/.env next to this file.

builders:
  ocr:
    engine: paddleocr
    endpoint: ${PADDLE_OCR_ENDPOINT}
    token: ${PADDLE_OCR_TOKEN}
    model: ${PADDLE_OCR_MODEL:PaddleOCR-VL-1.6}

# Models (Q100): how to talk to each one — where it is and which parameters it takes, written here instead of
# guessed from rejected requests.  The services and the agent's own loop choose one by name (`use`); what a
# place writes itself wins over the entry.  `efforts`: the reasoning efforts the model accepts (a task's effort
# is sent as the nearest; not listed: sent as asked; []: none sent); `structured_output`: the strongest JSON
# constraint it honours (json_schema / json_object / off).  Checked with `scripts/check_services.py --model`.
models:
  gpt-6-luna:
    endpoint: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api_key: ${OPENAI_API_KEY}
    model: gpt-6-luna
    # a reasoning model: it rejects temperature, so it is never sent (auto-detection would waste one rejected
    # request per concurrent worker before the service learns)
    send_temperature: false
    min_output_tokens: 1024
    efforts: [none, low, medium, high, xhigh, max]  # minimal is rejected (probed 2026-09-28)
    structured_output: json_schema
  deepseek-flash:
    endpoint: ${OPENAI_BASE_URL_D:https://api.deepseek.com}
    api_key: ${OPENAI_API_KEY_D}
    model: deepseek-flash
    api_style: chat          # also Responses; our loop hands its reasoning_content back on Chat (aada802)
    structured_output: json_object  # json_schema: "This response_format type is unavailable now" (2026-09-28)
    # every effort none … max is accepted: not listed.  At low it sometimes reasons for ~5000 tokens: with a
    # 2048-token budget the answer comes back empty (finish_reason length), so the floor is raised (2026-09-28)
    min_output_tokens: 8192
  glm-5.3-flashx:
    endpoint: ${OPENAI_BASE_URL_G:https://open.bigmodel.cn/api/paas/v4/}
    api_key: ${OPENAI_API_KEY_G}
    model: glm-5.3-flashx
    api_style: chat          # no Responses API (404)
    efforts: [low, high, max]  # always thinks; none / minimal / medium / xhigh are rejected (2026-09-28)
    structured_output: json_object  # json_schema is accepted but not honoured: fenced JSON (2026-09-28)

services:
  vlm:
    use: gpt-6-luna
    provider: openai
    reasoning_effort: none
    max_concurrent: 6
    timeout: 180

# Response cache (guide §8.3): every scan engine / VLM response is recorded and
# replayed.  read_write: replay hits, record misses · read_only: offline
# replay, a miss is an error · refresh: always request and record · off.
cache:
  mode: read_write
  dir: __CACHE_DIR__

# Scheduling (guide §8.2): transport retries happen in the gateway (the OpenAI
# SDK never retries); prices turn recorded token usage into cost_usd; budget
# limits are per document and unlimited by default.
scheduling:
  retry:
    max_attempts: 3
    backoff_s: 2.0
  prices:               # USD per 1M tokens, official endpoint, 2026-09-23 (guide §10.3)
    gpt-6-luna:   {input: 0.10, cached_input: 0.01, output: 0.50}
    gpt-5.6-luna: {input: 0.20, cached_input: 0.02, output: 1.20}
    gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.50}
    gpt-5.6-terra: {input: 2.00, cached_input: 0.20, output: 12.00}
    gpt-6-sol:    {input: 2.00, cached_input: 0.20, output: 10.00}
    deepseek-flash: {input: 0.30, cached_input: 0.006, output: 1.20}  # peak hours (off-peak half), api-docs.deepseek.com, 2026-09-27
    glm-5.3-flashx: {input: 0.30, cached_input: 0.084, output: 1.04}  # CNY 2.0 / 0.57 / 7.0 at 6.75 (2026-09-24), bigmodel.cn, 2026-09-28
