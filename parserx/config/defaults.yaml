# ParserX built-in defaults (Q100, Q107-Q108): the production settings and the models it knows.  Keys are not
# here: they go in the personal config ~/.config/parserx/config.yaml (`parserx init` writes it).  Layers, each
# deep-merged over the one before: these defaults, ./parserx.yaml (a project's own settings, optional), the personal
# config, and a --config file.  ${VAR} still reads a real environment variable.

# The scan engine (guide §10.2): PaddleOCR-VL through the AI Studio jobs API.  Needed for scanned pages and the text
# of images; its token is personal.
builders:
  ocr:
    engine: paddleocr
    endpoint: https://paddleocr.aistudio-app.com/api/v2/ocr/jobs
    model: PaddleOCR-VL-1.6

# Models (Q100): how to talk to each one — where it is and which parameters it takes, written here instead of
# guessed from rejected requests.  The services and the agent's own loop choose one by name (`use`); what a
# place writes itself wins over the entry.  `efforts`: the reasoning efforts the model accepts (a task's effort
# is sent as the nearest; not listed: sent as asked; []: none sent); `structured_output`: the strongest JSON
# constraint it honours (json_schema / json_object / off).  Checked with `scripts/check_services.py --model`.
models:
  gpt-6-luna:
    endpoint: https://api.openai.com/v1
    model: gpt-6-luna
    # a reasoning model: it rejects temperature, so it is never sent (auto-detection would waste one rejected
    # request per concurrent worker before the service learns)
    send_temperature: false
    min_output_tokens: 1024
    efforts: [none, low, medium, high, xhigh, max]  # minimal is rejected (probed 2026-09-28)
    structured_output: json_schema
  gpt-6-sol:                # the agent model of Codex, reachable from our own loop too (runtime.agent.use)
    endpoint: https://api.openai.com/v1
    model: gpt-6-sol
    api_style: responses
    send_temperature: false  # rejected (probed 2026-09-29)
    efforts: [none, low, medium, high, xhigh, max]  # minimal is rejected (probed 2026-09-29)
    structured_output: json_schema
  deepseek-flash:
    endpoint: https://api.deepseek.com
    model: deepseek-flash
    api_style: chat          # also Responses; our loop hands its reasoning_content back on Chat (aada802)
    structured_output: json_object  # json_schema: "This response_format type is unavailable now" (2026-09-28)
    # every effort none … max is accepted: not listed.  At low it sometimes reasons for ~5000 tokens: with a
    # 2048-token budget the answer comes back empty (finish_reason length), so the floor is raised (2026-09-28)
    min_output_tokens: 8192
  glm-5.3-flashx:
    endpoint: https://open.bigmodel.cn/api/paas/v4/
    model: glm-5.3-flashx
    api_style: chat          # no Responses API (404)
    efforts: [low, high, max]  # always thinks; none / minimal / medium / xhigh are rejected (2026-09-28)
    structured_output: json_object  # json_schema is accepted but not honoured: fenced JSON (2026-09-28)
  qwen3.8-flash:            # Alibaba Bailian (DashScope), Beijing region (docs/v2_model_config.md §8)
    # the common domain; the console's workspace domain https://<WorkspaceId>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    # is the recommended replacement: write it under endpoint in the personal config
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.8-flash
    api_style: chat          # Responses works too (probed 2026-10-02); reasoning_content comes back on Chat only, and the
                             # model wants it handed back in multi-turn (preserve_thinking is on by default)
    # multimodal (image, text, video in); 1M context, 131 072 output; max_tokens counts the answer only, not the thinking.
    # Every effort none … max is accepted: not listed (natively low / medium / xhigh; max and high become xhigh, minimal
    # low, none turns thinking off).  With no effort sent it thinks at xhigh with a 131 072-token budget: always send one.
    # Images are scaled down above 2 621 440 pixels (~1620²); extra_body: {vl_high_resolution_images: true} lifts the cap
    # to 16 777 216 at more input tokens — not on until the model probe says it matters (2026-10-02)
    # json_object: with json_schema, real tasks got the schema itself back (2–3 of 10 table reviews) or the object
    # wrapped in an array (figure notes), though the probe's small schema is honoured (model probe, 2026-10-02)
    structured_output: json_object
  doubao-seed-2-1-lite-260915:  # Volcengine Ark (Doubao), Beijing region; on trial in the model probe (docs/v2_model_probe.md §7.4)
    endpoint: https://ark.cn-beijing.volces.com/api/v3
    model: doubao-seed-2-1-lite-260915
    api_style: chat          # Ark has Responses too (the console's sample uses it)
    # text, image, video in; 1M context; answer up to 256K (4K when no budget is sent), thinking up to 256K; thinks by
    # default.  Chat: reasoning_effort none … max (none turns thinking off) or thinking.type; Responses:
    # reasoning.effort minimal turns it off (Ark docs, 2026-10-02; probe with `parserx check --model` before relying on it)

services:
  vlm:
    # qwen3.8-flash at low since 2026-10-02 (docs/v2_model_probe.md §7.3): in the image-reading probe it scored 91 to
    # luna's 85, copied what the original prints far more often (14 of 17 printed errors kept, luna 7), at a little
    # less cost and about luna's speed.  Tasks that set their own effort keep it.
    use: qwen3.8-flash
    provider: openai
    reasoning_effort: low
    max_concurrent: 6
    timeout: 180

# Response cache (guide §8.3): every scan engine / VLM response is recorded and
# replayed.  read_write: replay hits, record misses · read_only: offline
# replay, a miss is an error · refresh: always request and record · off.
cache:
  mode: read_write
  dir: ~/.cache/parserx

# Scheduling (guide §8.2): transport retries happen in the gateway (the OpenAI
# SDK never retries); prices turn recorded token usage into cost_usd; budget
# limits are per document and unlimited by default.
scheduling:
  retry:
    max_attempts: 3
    backoff_s: 2.0
  prices:               # USD per 1M tokens, official endpoint, 2026-09-23 (guide §10.3)
    gpt-6-luna:   {input: 0.10, cached_input: 0.01, output: 0.50}
    gpt-5.6-luna: {input: 0.20, cached_input: 0.02, output: 1.20}
    gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.50}
    gpt-5.6-terra: {input: 2.00, cached_input: 0.20, output: 12.00}
    gpt-6-sol:    {input: 2.00, cached_input: 0.20, output: 10.00}
    deepseek-flash: {input: 0.30, cached_input: 0.006, output: 1.20}  # peak hours (off-peak half), api-docs.deepseek.com, 2026-09-27
    glm-5.3-flashx: {input: 0.30, cached_input: 0.084, output: 1.04}  # CNY 2.0 / 0.57 / 7.0 at 6.75 (2026-09-24), bigmodel.cn, 2026-09-28
    qwen3.8-flash: {input: 0.12, cached_input: 0.015, output: 0.40}  # CNY 0.8 / 0.1 / 2.7 at 6.75, Bailian console price page (Beijing, checked by the user), 2026-10-02
    doubao-seed-2-1-lite-260915: {input: 0.12, cached_input: 0.12, output: 0.40}  # CNY 0.8 / ? / 2.7 at 6.75 from a third-party listing: to check on the Ark console; cache unknown (input price), 2026-10-02

# The agent (recommended; Q13, Q106, Q112): the standard processing first, then an agent on documents with open
# review items.  engine codex: Codex on this machine (`codex login`, its model and effort below); engine loop: our own
# loop with a model of `models` (use:, billed by that model's API).  mode fixed: the standard processing only.
# On the command line: --agent codex | --agent <model> | --no-agent.
runtime:
  mode: hybrid
  agent:
    engine: codex
    model: gpt-6-sol
    effort: medium
