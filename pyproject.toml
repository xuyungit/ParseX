[project]
name = "parserx"
version = "0.1.0"
description = "High-fidelity document parsing tool for knowledge bases, retrieval, and analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=3",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.6",
    "jsonschema>=4.26.0",
    "rapid-layout>=1.2.1",
    "onnxruntime>=1.30.0",
    "rapidocr>=3.7.0",
    "lxml>=6.1.3",
    "httpx2>=2.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
bench = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
]

[project.scripts]
psx = "parserx.cli:main"
parserx = "parserx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
markers = [
    "live_e2e: calls the real scan engine and VLM of the personal config",
    "live_layout: runs the real layout detector (downloads its model on first use)",
]
addopts = "-m 'not live_layout'"
