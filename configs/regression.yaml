# Evaluation config: the built-in defaults (parserx/config/defaults.yaml) with the service model and the response
# cache named here, so a personal config (~/.config/parserx/config.yaml) supplies only keys and endpoints (Q100 §3.1).
services:
  vlm:
    use: qwen3.8-flash
cache:
  mode: read_write
  dir: .parserx_cache
